    <!-- PWA Manifest Generation -->
    <script>
        function createIconPNG(size) {
            return new Promise(resolve => {
                const svgData = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 32 32' width='${size}' height='${size}'><rect x='3' y='3' width='18' height='10' rx='2' fill='#23A0B4'/><rect x='11' y='3' width='10' height='18' rx='2' fill='#23A0B4'/><rect x='5' y='5' width='5' height='5' fill='#E7F135' rx='0.5'/></svg>`;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, size, size); // Ensure transparent background
                    ctx.drawImage(img, 0, 0, size, size);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
            });
        }

        Promise.all([createIconPNG(192), createIconPNG(512)]).then(([png192, png512]) => {
            const svgUri = 'data:image/svg+xml;base64,' + btoa(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 32 32'><rect x='3' y='3' width='18' height='10' rx='2' fill='#23A0B4'/><rect x='11' y='3' width='10' height='18' rx='2' fill='#23A0B4'/><rect x='5' y='5' width='5' height='5' fill='#E7F135' rx='0.5'/></svg>`);

            const manifest = {
                "id": "todays-bundle-app",
                "name": "Today's Bundle",
                "short_name": "Bundle",
                "start_url": window.location.origin + window.location.pathname,
                "scope": window.location.origin + window.location.pathname,
                "display": "standalone",
                "orientation": "portrait",
                "background_color": "#0f0f0f",
                "theme_color": "#0f0f0f",
                "description": "Daily newsletter and aviation workspace hub.",
                "icons": [
                    { "src": svgUri, "sizes": "any", "type": "image/svg+xml", "purpose": "any" },
                    { "src": png192, "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
                    { "src": png512, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
                ]
            };
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'data:application/manifest+json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
            document.head.appendChild(link);

            const appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.href = png192;
            document.head.appendChild(appleLink);
        });
    </script>

                            <div class="small-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.3 1.3c-.2.3-.1.7.3.8l5.9 3.1L5 15.5l-2.8-.9c-.4-.1-.8.1-1 .5l-.7.7c-.2.2-.2.6 0 .8l3.6 2.3 2.3 3.6c.2.2.6.2.8 0l.7-.7c.4-.2.6-.6.5-1l-.9-2.8 3.6-3.6 3.1 5.9c.1.4.5.5.8.3l1.3-1.3c.3-.2.6-.6.5-1.1z"/></svg></div>

                            <div class="small-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div>

        </header>

        <div id="newsletter-viewer" class="viewer-container bg-white dark:bg-[#0f0f0f] overflow-hidden shadow-sm relative hidden group w-full flex-1 border border-gray-200 dark:border-[#333] rounded-[1.5rem] md:rounded-[2.5rem]">
            <iframe id="news-frame" src="about:blank" style="color-scheme: inherit;" class="w-full h-full border-none bg-white dark:bg-[#0f0f0f]" title="Bundle Archive"></iframe>
            
            <!-- Fullscreen Button -->
            <button id="btn-fullscreen" class="absolute bottom-6 right-6 z-50 p-2.5 bg-black/40 hover:bg-black/70 text-white rounded-xl backdrop-blur-sm opacity-100 md:opacity-0 group-hover:opacity-100 transition-all duration-300 focus:outline-none" title="Toggle Fullscreen">
                <svg id="icon-fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                <svg id="icon-fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
            </button>

            <div id="loading-overlay" class="absolute inset-0 bg-white dark:bg-[#0f0f0f] flex items-center justify-center transition-opacity duration-300 z-20">
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 border-4 border-[#F3EBE3] border-t-[#23A0B4] rounded-full animate-spin mb-4"></div>
                    <span class="text-xs text-gray-400 font-medium uppercase tracking-widest">Loading Content</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PWA Service Worker with Resilient Caching for Android WebAPK
        if ('serviceWorker' in navigator) {
            const currentUrl = window.location.origin + window.location.pathname;
            const swCode = `
                const CACHE_NAME = 'bundle-v5';
                const APP_URL = '${currentUrl}';
                
                self.addEventListener('install', (event) => {
                    self.skipWaiting();
                    event.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => {
                            // Non-blocking addAll for core resources
                            return cache.addAll([APP_URL]).catch(err => console.log("Cache error", err));
                        })
                    );
                });
                
                self.addEventListener('activate', (event) => {
                    event.waitUntil(
                        caches.keys().then(keys => Promise.all(
                            keys.map(key => {
                                if (key !== CACHE_NAME) return caches.delete(key);
                            })
                        )).then(() => self.clients.claim())
                    );
                });
                
                self.addEventListener('fetch', (event) => {
                    // Standard fetch handler required for PWA installability
                    if (event.request.method !== 'GET') return;
                    event.respondWith(
                        fetch(event.request)
                            .then(networkResponse => {
                                // Update cache on successful network fetch if it's the main app URL
                                if (event.request.url === APP_URL) {
                                    const responseClone = networkResponse.clone();
                                    caches.open(CACHE_NAME).then(cache => cache.put(event.request, responseClone));
                                }
                                return networkResponse;
                            })
                            .catch(() => {
                                // Fallback to cache
                                return caches.match(event.request).then(cachedResponse => {
                                    if (cachedResponse) return cachedResponse;
                                    // Navigation fallback
                                    if (event.request.mode === 'navigate') {
                                        return caches.match(APP_URL);
                                    }
                                    return new Response('Offline');
                                });
                            })
                    );
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        // App Panel / Navigation
        const appsPanel = document.getElementById('apps-panel');
        const newsFrame = document.getElementById('news-frame');
        const overlay = document.getElementById('loading-overlay');
        const viewerContainer = document.getElementById('newsletter-viewer');
        const BASE_URL = "https://static.bundle.app/newsletter/";
        const btnToday = document.getElementById('btn-today');
        const btnYesterday = document.getElementById('btn-yesterday');

        function togglePanel() {
            appsPanel?.classList.toggle('open');
            document.body.classList.toggle('overflow-hidden');
        }
        document.getElementById('close-apps')?.addEventListener('click', togglePanel);

        let isViewerVisible = false;
        if (newsFrame) {
            newsFrame.onload = () => {
                setTimeout(() => {
                    if (overlay) {
                        overlay.classList.remove('opacity-100');
                        overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.style.display = 'none', 300);
                    }
                }, 500);
            };
        }

        function openInViewer(url) {
            if (appsPanel?.classList.contains('open')) togglePanel();
            viewerContainer?.classList.remove('hidden');
            if (newsFrame) newsFrame.style.display = 'block';
            const isLocal = url.startsWith(BASE_URL);
            btnToday?.classList.toggle('hidden', !isLocal);
            btnYesterday?.classList.toggle('hidden', !isLocal);
            isViewerVisible = true;
            if (overlay) {
                overlay.style.display = 'flex';
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
            }
            if (newsFrame) newsFrame.src = url;
        }

        function loadForDate(d) {
            const url = `${BASE_URL}${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}.html`;
            openInViewer(url);
        }

        document.getElementById('bundle-logo')?.addEventListener('click', () => {
            loadForDate(new Date());
        });

        const ambientUrls = [
            'https://zzz.zoomquilt.org/',
            'https://zzz.zoomquilt2.com/',
            'https://zzz.arkadia.xyz/',
            'https://infiniteflowers.net/'
        ];

        document.getElementById('bundle-text')?.addEventListener('click', () => {
            openInViewer(ambientUrls[Math.floor(Math.random() * ambientUrls.length)]);
        });

        btnToday?.addEventListener('click', () => loadForDate(new Date()));
        btnYesterday?.addEventListener('click', () => {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            loadForDate(yesterday);
        });

        // Mobile Dropdown Support
        document.querySelectorAll('.group > button:not(#btn-fullscreen), .group\\/sub > a').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const menu = btn.nextElementSibling;
                if (menu && menu.classList.contains('absolute')) {
                    const isOpen = menu.classList.contains('mobile-menu-open');
                    
                    // Close other open menus on the same level
                    if (btn.tagName === 'BUTTON') {
                        document.querySelectorAll('.group > div.absolute').forEach(m => m.classList.remove('mobile-menu-open'));
                    }
                    
                    if (!isOpen) {
                        menu.classList.add('mobile-menu-open');
                    } else {
                        menu.classList.remove('mobile-menu-open');
                    }
                    e.stopPropagation();
                }
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.mobile-menu-open').forEach(m => m.classList.remove('mobile-menu-open'));
        });

        window.addEventListener('message', (e) => { if (e.data.url) openInViewer(e.data.url); });

        // Fullscreen Logic
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const iconFsEnter = document.getElementById('icon-fullscreen-enter');
        const iconFsExit = document.getElementById('icon-fullscreen-exit');
        let isManualFullscreen = false;

        function updateFullscreenUI(isFullscreen) {
            if (isFullscreen) {
                iconFsEnter.classList.add('hidden');
                iconFsExit.classList.remove('hidden');
                viewerContainer.classList.remove('rounded-[1.5rem]', 'md:rounded-[2.5rem]', 'relative', 'border', 'border-gray-200', 'dark:border-[#333]');
                viewerContainer.classList.add('!fixed', 'inset-0', 'z-[9999]', '!h-[100dvh]', '!w-screen', '!max-w-none', '!rounded-none', '!m-0', '!border-none');
                document.body.style.overflow = 'hidden';
            } else {
                iconFsExit.classList.add('hidden');
                iconFsEnter.classList.remove('hidden');
                viewerContainer.classList.add('rounded-[1.5rem]', 'md:rounded-[2.5rem]', 'relative', 'border', 'border-gray-200', 'dark:border-[#333]');
                viewerContainer.classList.remove('!fixed', 'inset-0', 'z-[9999]', '!h-[100dvh]', '!w-screen', '!max-w-none', '!rounded-none', '!m-0', '!border-none');
                document.body.style.overflow = '';
            }
        }

        if (btnFullscreen && viewerContainer) {
            btnFullscreen.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!newsFrame) return;
                
                try {
                    // Try to inject selective inversion CSS inside the iframe (if same-origin allows)
                    const doc = newsFrame.contentDocument || newsFrame.contentWindow.document;
                    let style = doc.getElementById('smart-dark-mode');
                    if (style) {
                        style.remove();
                    } else {
                        style = doc.createElement('style');
                        style.id = 'smart-dark-mode';
                        style.textContent = `
                            html { filter: invert(1) hue-rotate(180deg) !important; background: #fff !important; }
                            img, picture, video, iframe, canvas, svg, [style*="background-image"] { filter: invert(1) hue-rotate(180deg) !important; }
                        `;
                        doc.head.appendChild(style);
                    }
                } catch(err) {
                    // CORS Fallback: Invert the entire iframe from the outside
                    if (newsFrame.style.filter === 'invert(1) hue-rotate(180deg)') {
                        newsFrame.style.filter = 'none';
                    } else {
                        newsFrame.style.filter = 'invert(1) hue-rotate(180deg)';
                    }
                }
            });

            btnFullscreen.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const isNativeFS = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                if (!isNativeFS && !isManualFullscreen) {
                    if (viewerContainer.requestFullscreen) {
                        viewerContainer.requestFullscreen().catch(() => {
                            isManualFullscreen = true;
                            updateFullscreenUI(true);
                        });
                    } else if (viewerContainer.webkitRequestFullscreen) {
                        viewerContainer.webkitRequestFullscreen();
                    } else if (viewerContainer.msRequestFullscreen) {
                        viewerContainer.msRequestFullscreen();
                    } else {
                        isManualFullscreen = true;
                        updateFullscreenUI(true);
                    }
                } else {
                    if (isNativeFS) {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        else if (document.msExitFullscreen) document.msExitFullscreen();
                    } else {
                        isManualFullscreen = false;
                        updateFullscreenUI(false);
                    }
                }
            });

            document.addEventListener('fullscreenchange', () => updateFullscreenUI(!!document.fullscreenElement));
            document.addEventListener('webkitfullscreenchange', () => updateFullscreenUI(!!document.webkitFullscreenElement));
            document.addEventListener('msfullscreenchange', () => updateFullscreenUI(!!document.msFullscreenElement));
        }

        window.onload = () => {
            openInViewer(ambientUrls[Math.floor(Math.random() * ambientUrls.length)]);
            
            // PWA Install Prompt Logic
            let deferredPrompt;

            window.addEventListener('beforeinstallprompt', (e) => {
                // Prevent Chrome 67 and earlier from automatically showing the prompt
                e.preventDefault();
                // Stash the event so it can be triggered later.
                deferredPrompt = e;
            });

            window.addEventListener('appinstalled', (evt) => {
                deferredPrompt = null;
            });
        };
    </script>
</body>
